
 <div class="contenedor">

  <h2>Listado de Categorías</h2>

  <div class="barra-superior">

    <mat-form-field appearance="fill" class="buscador">
      <mat-label>Buscar Categorías</mat-label>

      <input
        matInput
        placeholder="Busque por nombre o id de categoría" #input
        (keyup)="buscarCategoria($event)">
    </mat-form-field>
<div class="botones">
  <button class="agregar" mat-raised-button color="primary" (click)="openCategoryDialog()">
    Agregar Categoría
  </button>

  <button mat-raised-button class="excel-button" (click)="exportExcel()">
    <mat-icon class="excelicon">cloud_upload</mat-icon>
    Exportar a Excel
  </button>
</div>


  </div>

  <div class="tabla-contenedor mat-elevation-z8">

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="idcategory">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let categoria">
          {{ categoria.idcategory }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let categoria">
          {{ categoria.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let categoria">
          {{ categoria.description }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>

        <td mat-cell *matCellDef="let categoria" >
          
          <button mat-icon-button color="primary" 
            (click)="edit(categoria.idcategory, categoria.name, categoria.description)">
            <mat-icon class="icon">edit</mat-icon>
          </button>
          @if (isAdmin) {
          <button mat-icon-button color="primary" 
          (click)="deleteCategoria(categoria.idcategory)">
            <mat-icon class="icon">delete</mat-icon>
          </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

  </div>

</div>
